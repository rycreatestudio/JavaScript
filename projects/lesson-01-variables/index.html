<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 1 Project — Player Profile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .instructions {
      background: #1a1d27;
      border: 1px solid #2a2f3d;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #9aa0b0;
    }

    .instructions strong { color: #7cacf8; }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2f3d;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #2a2f3d;
      color: #7cacf8;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .player-name {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .game-title {
      color: #9aa0b0;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: #0f1117;
      border-radius: 10px;
      padding: 14px;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 20px;
      background: #0f1117;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7280;
    }

    .dot.online  { background: #34d399; }
    .dot.offline { background: #f87171; }

    .hint {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #6b7280;
    }

    kbd {
      background: #2a2f3d;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="instructions">
      Open <strong>script.js</strong> and follow the steps.
      Press <kbd>F12</kbd> or <kbd>Cmd+Option+J</kbd> to open the console and see your <code>console.log()</code> output.
    </div>

    <div class="card">
      <div class="badge">Player Profile</div>
      <div class="player-name" id="player-name">???</div>
      <div class="game-title" id="game-title">???</div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Level</div>
          <div class="stat-value" id="level">?</div>
        </div>
        <div class="stat">
          <div class="stat-label">Score</div>
          <div class="stat-value" id="score">?</div>
        </div>
      </div>

      <div class="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Offline</span>
      </div>

      <p class="hint">Values update as you complete each step in script.js</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
